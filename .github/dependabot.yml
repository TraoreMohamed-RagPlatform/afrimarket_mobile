# Mises à jour automatiques des dépendances (GitHub Dependabot)
version: 2
updates:
  # Packages Dart / Flutter (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Paquets dont la version est imposée par le SDK Flutter
    # (déclarés avec « any ») : ils suivent les mises à jour de Flutter.
    ignore:
      - dependency-name: "meta"
      - dependency-name: "intl"

  # Actions utilisées dans les workflows GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5