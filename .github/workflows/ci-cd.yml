# ============================================================
#  AfriMarket Mobile – Pipeline CI/CD DevSecOps (outils gratuits)
# ============================================================
name: CI/CD DevSecOps - AfriMarket Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

# Moindre privilège : lecture seule par défaut
permissions:
  contents: read

# Annule un run en cours si un nouveau push arrive sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'

jobs:
  # ----------------------------------------------------------
  # 1. Qualité du code : formatage + analyse statique Dart
  # ----------------------------------------------------------
  quality:
    name: 🧹 Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique (flutter analyze)
        run: flutter analyze

  # ----------------------------------------------------------
  # 2. Tests unitaires / widget + couverture
  # ----------------------------------------------------------
  tests:
    name: 🧪 Tests + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Lancer les tests avec couverture
        run: flutter test --coverage

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # ----------------------------------------------------------
  # 3. Vulnérabilités des dépendances (OSV-Scanner – Google)
  # ----------------------------------------------------------
  dependencies:
    name: 📦 Dépendances (OSV-Scanner)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: Scanner pubspec.lock
        run: ./osv-scanner scan source -L pubspec.lock

      - name: Générer le rapport SARIF
        if: always()
        run: ./osv-scanner scan source -L pubspec.lock --format sarif > osv-results.sarif || true

      - name: Publier dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # ----------------------------------------------------------
  # 4. Détection de secrets (TruffleHog)
  # ----------------------------------------------------------
  secrets:
    name: 🔑 Secrets (TruffleHog)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique Git

      - name: Scanner les secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # ----------------------------------------------------------
  # 5. SAST – SonarCloud (ignoré si SONAR_TOKEN absent)
  # ----------------------------------------------------------
  sonarcloud:
    name: 📊 SonarCloud (SAST)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour l'analyse des nouveaux changements

      - name: Token absent
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN non configuré – analyse SonarCloud ignorée"

      - uses: subosito/flutter-action@v2
        if: env.SONAR_TOKEN != ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances + tests (couverture pour Sonar)
        if: env.SONAR_TOKEN != ''
        run: |
          flutter pub get
          flutter test --coverage

      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ----------------------------------------------------------
  # 6. CodeQL – sécurité des workflows GitHub Actions
  # ----------------------------------------------------------
  codeql:
    name: 🛡️ CodeQL (workflows)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Analyser
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-actions

  # ----------------------------------------------------------
  # 7. Build APK (seulement si qualité + tests OK)
  # ----------------------------------------------------------
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler l'APK release
        run: flutter build apk --release

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v7
        with:
          name: afrimarket-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ----------------------------------------------------------
  # 8. Résumé du pipeline
  # ----------------------------------------------------------
  summary:
    name: 📋 Résumé
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, tests, dependencies, secrets, sonarcloud, codeql, build]
    steps:
      - name: Générer le résumé
        run: |
          {
            echo "## 📋 Pipeline DevSecOps – AfriMarket Mobile"
            echo ""
            echo "| Job | Résultat |"
            echo "|---|---|"
            echo "| 🧹 Qualité du code | ${{ needs.quality.result }} |"
            echo "| 🧪 Tests + couverture | ${{ needs.tests.result }} |"
            echo "| 📦 Dépendances (OSV-Scanner) | ${{ needs.dependencies.result }} |"
            echo "| 🔑 Secrets (TruffleHog) | ${{ needs.secrets.result }} |"
            echo "| 📊 SonarCloud | ${{ needs.sonarcloud.result }} |"
            echo "| 🛡️ CodeQL (workflows) | ${{ needs.codeql.result }} |"
            echo "| 🏗️ Build APK | ${{ needs.build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Échouer si un job bloquant a échoué
        if: needs.quality.result != 'success' || needs.tests.result != 'success' || needs.build.result != 'success'
        run: |
          echo "❌ Qualité, tests ou build en échec"
          exit 1