# Règles de code strictes (standard Very Good Ventures, basé sur Effective Dart)
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Fichiers générés automatiquement : pas d'analyse
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
  errors:
    # Nécessaire pour les annotations JSON avec freezed
    invalid_annotation_target: ignore

linter:
  rules:
    # Documentation obligatoire des API publiques : inutile pour une app
    # (utile pour une librairie publiée), on la désactive
    public_member_api_docs: false