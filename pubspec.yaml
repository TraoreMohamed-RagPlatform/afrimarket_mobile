name: afrimarket_mobile
description: "AfriMarket - Marketplace mobile pour la communauté subsaharienne au Maroc"
publish_to: 'none'

# Versioning SemVer : MAJEUR.MINEUR.CORRECTIF+BUILD
# 0.x = avant la première publication sur les stores
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: any
  json_annotation: ^4.12.0

  meta: any
dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true